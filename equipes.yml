# ─────────────────────────────────────────────────────────────────────────
# LISTE DES ÉQUIPES — source unique de vérité
#
# Vous seul modifiez ce fichier. Les étudiants n'y touchent jamais.
# Rempli une fois en début de session, il alimente automatiquement :
#
#   • la page titre de chaque PDF (titre, cours, auteurs, date, licence)
#   • le nom de chaque fichier produit
#   • les avertissements de cohérence dans les pull requests
#
# Résultat : vos étudiants n'écrivent aucune métadonnée. Ils rédigent, c'est tout.
# ─────────────────────────────────────────────────────────────────────────

titre: "Stratégie de recherche"
cours: "PHA 0000 — Recherche documentaire en santé"
etablissement: "Université de Montréal"
session: "Automne 2026"
licence: "CC BY 4.0"


# ─── Qui signe la page titre ─────────────────────────────────────────────
#
#   equipe   → « Équipe 01 » partout. Tout « membres » inscrit plus bas est
#              ignoré. C'est le réglage à garder pendant la session.
#   membres  → une équipe qui a des « membres » signe de leurs noms ; une
#              équipe qui n'en a pas signe « Équipe NN ». C'est le réglage du
#              moment où on dépose dans Papyrus.
#
# ⚠ Le repository est public et l'historique Git est définitif : un nom
#   enregistré une fois ne s'efface plus, même si on retire la ligne après.
#
#   Mettre soixante noms ici en début de session, avant que personne ait
#   consenti, revient à publier la liste de classe. L'inscription à un cours
#   est un renseignement personnel au sens de la Loi 25, et ça annule aussi la
#   protection que donnent les comptes pseudonymes.
#
#   Une équipe qui décide de déposer dans Papyrus, elle, publie déjà sous son
#   nom. Ajouter ses membres ici à ce moment-là, à sa demande, ne rend public
#   que ce qu'elle a elle-même choisi de publier. C'est aussi ce qui permet au
#   PDF déposé de porter ses auteurs : sans ça, la licence CC BY n'aurait
#   personne à créditer.
#
#   Marche à suivre en fin de session : passez à « membres », ajoutez les noms
#   des seules équipes qui déposent, relancez le workflow et récupérez les PDF.
#   Les autres équipes continuent de signer « Équipe NN ».
#
auteurs: equipe


# ─── Les équipes ─────────────────────────────────────────────────────────
#
# Trois formes acceptées, mêlées librement :
#
#   equipe-01:                        ← rien à déclarer
#
#   equipe-02:
#     titre: "Antibioprophylaxie en chirurgie orthopédique"
#
#   equipe-03:
#     titre: "…"
#     membres:
#       - Tremblay, Léa
#       - Samuel Côté
#
# « titre » remplace le titre général sur la page titre de cette équipe.
# Renseignez-le pour les travaux destinés à Papyrus, où chaque notice a besoin
# d'un titre distinct. Laissé vide, le titre général s'applique.
#
# « membres » n'est lu que si auteurs: membres. Deux conventions de nom
# fonctionnent, même mélangées :
#   - Tremblay, Léa   → nom de famille = ce qui précède la virgule
#   - Léa Tremblay    → nom de famille = le dernier mot

equipes:

  equipe-01:
  equipe-02:
  equipe-03:
  equipe-04:
  equipe-05:
  equipe-06:
